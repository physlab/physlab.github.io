        <!--
      Other half of the public/404.html redirect trick: turns the "?/path" query
      string GitHub Pages' 404 page produced back into a normal URL via
      history.replaceState, before TanStack Router boots and reads location.
      See: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, l.pathname.length - (l.pathname.endsWith('/') ? 1 : 0)) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
